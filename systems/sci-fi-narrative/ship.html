<!doctype html>
<html>

<head>
    <title>Ship</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./character-sheet.css">
    </style>
</head>

<body>

    <div id="details">
        <div id="name" class="box">
            <h2>Name</h2>
        </div>

        <div id="credits" class="box">
            <h2>Fuel</h2>
        </div>
    </div>

     <div id="details">
        <div id="name" class="box">
            <h2>Upgrades</h2>
        </div>

        <div id="credits" class="box">
            <h2>Size</h2>
        </div>
    </div>
    <div id="stats">
        <div id="attributes">
            <div class="attr-group box">
                <h2>Attributes</h2>
                <div class="attr">
                    <h3>Engines</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Shields</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Weapons</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="box">
            <h2 class="crew">Crew</h2>
                <div class="line big"></div>
                <div class="line big"></div>
                <div class="line big"></div>
                <div class="line big"></div>
                <div class="line big"></div>
            </div>

        </div>
        <div id="health" class="box">
            <h2>Hit Points and Damage</h2>
            Small: 10HP | Medium: 15HP | Large: 20HP (-1D6 on rolls when damaged)
            <div>
                <h3>Level 3 Damage (-6HP each)</h3>
                <div class="line"></div>
                <div class="line"></div>
                <h3>Level 2 Damage (-3HP each)</h3>

                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <h3>Level 1 Damage (-1HP each)</h3>

                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>

            </div>
        </div>
    </div>
    <div id="equipment" class="box">
        <h2>Hold</h2>
        <div id="gear">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
