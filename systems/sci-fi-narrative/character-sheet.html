<!doctype html>
<html>

<head>
    <title>Character Sheet</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./character-sheet.css">
    </style>
</head>

<body>

    <div id="details">
        <div id="name" class="box">
            <h2>Name</h2>
        </div>

        <div id="credits" class="box">
            <h2>Credits</h2>
        </div>
    </div>

    <div id="appearance" class="box">
        <h2>Clothing</h2>
    </div>
    <div id="stats">
        <div id="attributes" class="box">
            <div class="attr-group">
                <h2>Body</h2>
                <div class="attr">
                    <h3>Athletics</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Fighting</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Survival</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="attr-group">
                <h2>Mind</h2>
                <div class="attr">
                    <h3>Cunning</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Knowledge</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Perception</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="attr-group">
                <h2>Soul</h2>
                <div class="attr">
                    <h3>Bravery</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Charisma</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="attr">
                    <h3>Psychic</h3>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        <div id="health" class="box">
            <h2>Hit Points and Injuries</h2>
            10HP (-1D6 on rolls when injured)
            <div>
                <h3>Level 3 Injuries (-6HP each)</h3>
                <div class="line"></div>
                <div class="line"></div>
                <h3>Level 2 Injuries (-3HP each)</h3>

                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <h3>Level 1 Injuries (-1HP each)</h3>

                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>

            </div>
        </div>
    </div>
    <div id="equipment" class="box">
        <h2>Equipment</h2>
        <div id="gear">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>
</body>

</html>
