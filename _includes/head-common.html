<title>{{ site.title }} - {{ page.title }}</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="iendjinn's blog: TRPG reviews, sci-fi and other musings">
<link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon/icon-512x512.png">
<link rel="manifest" href="/assets/favicon/site.webmanifest" />
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
<link rel="me" href="https://universeodon.com/@iendjinn">
<script>
    window.onload = function () {
        const theme = localStorage.getItem("theme") ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.querySelector("#theme-toggle").setAttribute("aria-pressed", true);
        } else {
            document.documentElement.classList.add("light");
        }
    }
    function toggleTheme() {
        const newTheme = document.documentElement.classList.contains("dark") ? "light" : "dark";
        localStorage.setItem("theme", newTheme);
        if (newTheme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
            document.querySelector("#theme-toggle").setAttribute("aria-pressed", true);
        } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
            document.querySelector("#theme-toggle").setAttribute("aria-pressed", false);
        }
    }
</script>
